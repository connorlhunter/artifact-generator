[install]
# Require packages to be at least one week old to reduce exposure to fresh supply chain attacks.
minimumReleaseAge = 604800

[test]
pathIgnorePatterns = ["coverage/**", "dist/**", "node_modules/**"]
coverageDir = "coverage"
coverageReporter = ["text", "lcov"]
coveragePathIgnorePatterns = [
  "scripts/core/clean-dist.ts",
  "scripts/diagrams/diagram-types.ts",
  "scripts/diagrams/open-diagrams.ts",
  "scripts/diagrams/render-diagrams.ts",
  "scripts/diagrams/render-open-diagrams.ts",
  "scripts/diagrams/validate-diagrams.ts",
  "scripts/docs/open-docs-preview.ts",
  "scripts/docs/preview/browser/**",
  "scripts/docs/render-open-docs-preview.ts",
  "scripts/coverage/open-coverage-report.ts",
  "scripts/publish/build-site-artifacts.ts",
  "test/resources/**",
]
coverageSkipTestFiles = true
