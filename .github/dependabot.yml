version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint currently supports the TypeScript 6.x compiler line.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
