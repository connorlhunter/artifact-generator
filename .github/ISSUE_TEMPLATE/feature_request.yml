name: Feature request
description: Propose a new capability or improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the requested change and its boundaries.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: List the observable conditions that will close this issue.
    validations:
      required: true
