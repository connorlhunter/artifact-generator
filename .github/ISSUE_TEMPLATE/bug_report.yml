name: Bug report
description: Report behavior that needs correction.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest reliable steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: List the observable conditions that will close this issue.
    validations:
      required: true
